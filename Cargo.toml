[package]
name = "fkdisp"
version = "0.1.0"
edition = "2021"
description = "WPS DISPIMG 图片转换工具 - Rust 版本"
authors = ["Your Name"]

[dependencies]
eframe = "0.29"
egui = "0.29"
zip = "2.2"
quick-xml = "0.36"
rfd = "0.15"
regex = "1"
once_cell = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
